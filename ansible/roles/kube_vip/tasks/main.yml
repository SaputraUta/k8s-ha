---
- name: Ensure the static pod manifest directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: "0755"

- name: Create a kube-vip kubeconfig from admin.conf
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /etc/kubernetes/kube-vip.conf
    remote_src: true
    force: false
    mode: "0600"

- name: Point the kube-vip kubeconfig at this node's own API server
  ansible.builtin.replace:
    path: /etc/kubernetes/kube-vip.conf
    regexp: 'server: https://.*:6443'
    replace: 'server: https://{{ ansible_host }}:6443'

- name: Pull the kube-vip image
  ansible.builtin.command: "ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}"
  changed_when: false

- name: Render the kube-vip static pod manifest
  ansible.builtin.shell: >
    ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip
    /kube-vip manifest pod
    --interface {{ ansible_default_ipv4.interface }}
    --address {{ control_plane_vip }}
    --controlplane
    --arp
    --leaderElection
    --k8sConfigPath /etc/kubernetes/kube-vip.conf
    > /tmp/kube-vip.yaml
  changed_when: false

- name: Install the kube-vip static pod manifest
  ansible.builtin.copy:
    src: /tmp/kube-vip.yaml
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    remote_src: true
    mode: "0644"