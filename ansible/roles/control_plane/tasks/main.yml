---
- name: Initialize the first control plane
  ansible.builtin.command: >
    kubeadm init
    --control-plane-endpoint={{ control_plane_vip }}:6443
    --apiserver-advertise-address={{ ansible_host }}
    --pod-network-cidr={{ pod_network_cidr }}
    --upload-certs
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Create .kube directory for the ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Install kubeconfig for the ubuntu user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Generate a join command
  ansible.builtin.command: kubeadm token create --print-join-command
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: join_command_raw
  changed_when: false

- name: Re-upload the control plane certificates
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: upload_certs_raw
  changed_when: false

- name: Save join facts for the other control plane
  ansible.builtin.set_fact:
    join_command: "{{ join_command_raw.stdout }}"
    certificate_key: "{{ upload_certs_raw.stdout_lines | select('match', '^[a-f0-9]{64}$') | first }}"