---
- name: Prep all nodes for Kuberneted
  hosts: k8s
  become: true
  roles: [common]

- name: Bootstrap the first control plane
  hosts: primary_cp
  become: true
  roles: [control_plane]

- name: Set up kube-vip on the first control plane
  hosts: primary_cp
  become: true
  roles: [kube_vip]

- name: Install the CNI (Calico)
  hosts: primary_cp
  become: true
  roles: [cni]

- name: Join the remaining control planes
  hosts: secondary_cp
  become: true
  serial: 1
  roles: [join_control_plane]

- name: Set up kube-vip on the remaining control planes
  hosts: secondary_cp
  become: true
  roles: [kube_vip]

- name: Join the workers
  hosts: workers
  become: true
  roles: [worker]